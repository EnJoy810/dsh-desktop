<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<title>设置 — DeepSeek Harness</title>
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; style-src 'unsafe-inline'; script-src 'unsafe-inline'">
<style>
  :root {
    --bg: #f5f6f7;
    --card: #ffffff;
    --border: #e3e5e8;
    --text: #1f2329;
    --text-2: #646a73;
    --accent: #2563eb;
    --accent-weak: #eff4ff;
    --chip-bg: #eef0f2;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: -apple-system, "Segoe UI", "Microsoft YaHei", system-ui, sans-serif;
    background: var(--bg);
    color: var(--text);
    font-size: 13px;
    padding: 20px;
    -webkit-user-select: none;
    user-select: none;
  }
  header { margin-bottom: 16px; }
  h1 { font-size: 17px; font-weight: 600; }
  .sub { color: var(--text-2); margin-top: 4px; font-size: 12px; }
  .card {
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: 10px;
    padding: 16px 18px;
  }
  .card h2 {
    font-size: 13px;
    font-weight: 600;
    color: var(--text);
    margin-bottom: 12px;
    padding-bottom: 10px;
    border-bottom: 1px solid var(--border);
  }
  .row {
    display: flex;
    align-items: center;
    gap: 12px;
    padding: 9px 0;
  }
  .row-label { width: 72px; color: var(--text-2); flex-shrink: 0; }
  .row-control { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
  kbd {
    font-family: inherit;
    font-size: 12px;
    background: var(--chip-bg);
    border: 1px solid var(--border);
    border-radius: 5px;
    padding: 2px 7px;
    box-shadow: 0 1px 0 rgba(0,0,0,.05);
  }
  .hint { color: var(--text-2); font-size: 12px; margin-left: 4px; }
  .key-chip {
    min-width: 74px;
    text-align: center;
    font-weight: 600;
    font-size: 12px;
    color: var(--text-2);
    background: var(--chip-bg);
    border: 1px dashed var(--border);
    border-radius: 6px;
    padding: 5px 12px;
  }
  .key-chip.active {
    color: var(--accent);
    background: var(--accent-weak);
    border: 1px solid var(--accent);
    border-style: solid;
  }
  button {
    font-family: inherit;
    font-size: 12px;
    border-radius: 6px;
    padding: 5px 14px;
    cursor: pointer;
    border: 1px solid var(--border);
    background: var(--card);
    color: var(--text);
  }
  button:hover { background: #f0f2f5; }
  button.primary { background: var(--accent); border-color: var(--accent); color: #fff; }
  button.primary:hover { background: #1d4ed8; }
  button.primary.capturing {
    background: #f59e0b;
    border-color: #f59e0b;
    animation: pulse 1s ease-in-out infinite;
  }
  button:disabled { opacity: .45; cursor: default; }
  @keyframes pulse { 0%,100% { opacity: 1; } 50% { opacity: .65; } }
  .note {
    margin-top: 12px;
    color: var(--text-2);
    font-size: 12px;
    line-height: 1.7;
    border-top: 1px dashed var(--border);
    padding-top: 10px;
  }
  .note b { color: var(--text); font-weight: 600; }
</style>
</head>
<body>
  <header>
    <h1>设置</h1>
    <p class="sub">更改后即时生效，自动保存</p>
  </header>

  <section class="card">
    <h2>背景切换</h2>
    <div class="row">
      <div class="row-label">快捷键</div>
      <div class="row-control">
        <kbd>Ctrl</kbd> + <kbd>B</kbd>
        <span class="hint">固定快捷键（菜单 View &gt; Change Background…）</span>
      </div>
    </div>
    <div class="row">
      <div class="row-label">实体按键</div>
      <div class="row-control">
        <span id="keyDisplay" class="key-chip">未设置</span>
        <button id="bindBtn" type="button" class="primary">重新绑定</button>
        <button id="clearBtn" type="button">清除</button>
      </div>
    </div>
    <p class="note">
      绑定后，应用窗口聚焦时按下该<b>实体按键</b>即可打开「选择背景图片」对话框（无需组合键）。
      建议使用 F1–F12、Insert、Home 等功能键，避免与打字输入冲突。
    </p>
  </section>

<script>
(function () {
  const $ = (id) => document.getElementById(id)
  const MODIFIERS = new Set(['Control', 'Shift', 'Alt', 'Meta', 'AltGraph', 'CapsLock', 'NumLock', 'ScrollLock', 'Fn', 'FnLock', 'Hyper', 'Super', 'OS', 'Process'])
  const KEY_LABELS = {
    insert: 'Insert', delete: 'Del', home: 'Home', end: 'End',
    pageup: 'PgUp', pagedown: 'PgDn',
    arrowup: '↑', arrowdown: '↓', arrowleft: '←', arrowright: '→',
    space: 'Space', tab: 'Tab', escape: 'Esc', backspace: 'Backspace'
  }

  let boundKey = null   // lowercased physical key, null = not set
  let capturing = false

  function normalizeKey(e) {
    if (MODIFIERS.has(e.key)) return null        // ignore bare modifier presses
    if (e.key === ' ') return 'space'
    if (e.key === 'Tab') return 'tab'
    return e.key.toLowerCase()
  }

  function keyLabel(k) {
    if (KEY_LABELS[k]) return KEY_LABELS[k]
    if (/^f\d+$/.test(k)) return k.toUpperCase()
    return k.length === 1 ? k.toUpperCase() : k
  }

  function render() {
    const disp = $('keyDisplay')
    if (boundKey) {
      disp.textContent = keyLabel(boundKey)
      disp.classList.add('active')
      $('clearBtn').disabled = false
    } else {
      disp.textContent = '未设置'
      disp.classList.remove('active')
      $('clearBtn').disabled = true
    }
    const btn = $('bindBtn')
    btn.textContent = capturing ? '请按下按键…' : '重新绑定'
    btn.classList.toggle('capturing', capturing)
  }

  async function saveKey(k) {
    boundKey = k
    render()
    try { await window.dshDesktop.saveSettings({ bgChangeKey: k }) } catch {}
  }

  async function refresh() {
    try {
      const s = await window.dshDesktop.getSettings()
      boundKey = s && typeof s.bgChangeKey === 'string' ? s.bgChangeKey.toLowerCase() : null
    } catch { boundKey = null }
    render()
  }

  $('bindBtn').addEventListener('click', () => { capturing = true; render() })

  $('clearBtn').addEventListener('click', () => saveKey(null))

  document.addEventListener('keydown', (e) => {
    if (!capturing) return
    e.preventDefault()
    e.stopPropagation()
    if (e.key === 'Escape') { capturing = false; render(); return }
    const k = normalizeKey(e)
    if (!k) return
    capturing = false
    saveKey(k)
  })

  refresh()
})()
</script>
</body>
</html>
